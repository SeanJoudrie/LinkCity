<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link City</title>
<meta name="description" content="Everything Sean Joudrie is building, in one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Link City">
<meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Link City">
<meta property="og:description" content="Everything Sean Joudrie is building, in one place.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3eee4; --card:#fbf8f2; --ink:#1d1b18; --muted:#6d675d; --line:#ddd5c6;
  --lake:#1f6b74; --lake-soft:#d6e7e6; --rust:#a94f2a; --rust-soft:#f1dccf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#16181a;--card:#1f2225;--ink:#ece6da;--muted:#9a948a;--line:#33373b;
  --lake:#6cc1c6;--lake-soft:#1d3436;--rust:#e08a5f;--rust-soft:#3a2519;}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);min-height:100vh;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 32px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:28px 0 6px}
h1{font-weight:800;font-size:clamp(44px,11vw,88px);line-height:.88;letter-spacing:-.04em}
h1 span{color:var(--lake)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 12px;border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top))}
@supports (padding:max(0px)){ .bar{padding-top:max(12px, env(safe-area-inset-top))} }
.search{width:100%;font:500 17px var(--display);color:var(--ink);background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none}
.search:focus{border-color:var(--lake)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{font:600 12px var(--mono);letter-spacing:.02em;padding:7px 11px;border:0;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.count{font:12px var(--mono);color:var(--muted)}
.grid{display:grid;gap:14px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  text-decoration:none;color:inherit;transition:transform .15s ease}
.card:active{transform:scale(.985)}
.shot{position:relative;aspect-ratio:3/1;background:hsl(var(--h) 35% 86%);overflow:hidden;border-bottom:1px solid var(--line)}
@media (prefers-color-scheme: dark){ .shot{background:hsl(var(--h) 22% 22%)} }
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.shot .mono{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:44px;letter-spacing:-.04em;
  color:hsl(var(--h) 40% 38%)}
@media (prefers-color-scheme: dark){ .shot .mono{color:hsl(var(--h) 45% 70%)} }
.rank{position:absolute;top:10px;left:10px;font:600 11px var(--mono);background:var(--card);color:var(--ink);border-radius:6px;padding:3px 7px}
.body{padding:9px 12px 11px;display:flex;flex-direction:column;gap:4px}
.title{display:flex;align-items:center;gap:8px}
.title h2{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:5px;flex-shrink:0}
.tag.public{background:var(--lake-soft);color:var(--lake)}
.tag.personal{background:var(--rust-soft);color:var(--rust)}
.url{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{font-size:14px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:12px;font:12px var(--mono);color:var(--ink);margin-top:2px}
.meta b{font-weight:600}
.meta .dot{color:var(--muted)}
.links{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.links .top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted)}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .n{font-weight:800;font-size:15px;width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow a{flex:1;min-width:0;font:13px var(--mono);color:var(--lake);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;-webkit-user-select:all;user-select:all}
.cp{font:600 11px var(--mono);border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:7px;padding:5px 9px;cursor:pointer;flex-shrink:0}
.cp.ok{background:var(--ink);color:var(--paper)}
.empty{font:14px var(--mono);color:var(--muted);text-align:center;padding:48px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Link<br><span>City</span></h1>
    <div class="sub"><span id="status">Sean Joudrie · projects</span><button id="refresh" type="button">refresh stats</button></div>
  </header>
</div>
<div class="bar"><div class="wrap">
  <input class="search" id="q" type="search" placeholder="Search projects" autocomplete="off" autocorrect="off" spellcheck="false">
  <div class="row">
    <div class="seg" role="group" aria-label="Sort">
      <button data-sort="recent" aria-pressed="true">Recent</button>
      <button data-sort="commits" aria-pressed="false">Most work</button>
    </div>
    <div class="seg" role="group" aria-label="Filter">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="public" aria-pressed="false">Public</button>
      <button data-filter="personal" aria-pressed="false">Personal</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button data-view="cards" aria-pressed="true">Cards</button>
      <button data-view="links" aria-pressed="false">Links</button>
    </div>
    <span class="spacer"></span><span class="count" id="count"></span>
  </div>
</div></div>
<main class="wrap"><div class="grid" id="grid"></div></main>

<script src="projects.js"></script>
<script>
(function(){
  var KEY = "linkcity.stats.v1", TTL = 3 * 3600 * 1000;
  var state = { sort: "recent", filter: "all", q: "", view: "cards" };
  try { state.view = localStorage.getItem("linkcity.view") || "cards"; } catch(e){}
  var stats = load();

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || { t: 0, repos: {} }; } catch(e){ return { t: 0, repos: {} }; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch(e){} }

  function hue(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function ago(iso){
    var d = (Date.now() - new Date(iso)) / 1000;
    if (d < 3600) return Math.max(1, Math.round(d / 60)) + "m ago";
    if (d < 86400) return Math.round(d / 3600) + "h ago";
    if (d < 86400 * 30) return Math.round(d / 86400) + "d ago";
    return Math.round(d / (86400 * 30)) + "mo ago";
  }
  function ballpark(n){ if (n == null) return "–"; if (n < 20) return n; if (n < 100) return "~" + Math.round(n / 5) * 5; return "~" + Math.round(n / 10) * 10; }
  function liveUrl(p, s){
    if (p.live) return p.live;
    if (s && s.homepage) return /^https?:/.test(s.homepage) ? s.homepage : "https://" + s.homepage;
    var o = p.repo.split("/"); return "https://" + o[0].toLowerCase() + ".github.io/" + o[1] + "/";
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

  function render(){
    var q = state.q.trim().toLowerCase();
    var list = window.PROJECTS.map(function(p){
      var s = stats.repos[p.repo] || {};
      return { p: p, s: s, pushed: s.pushed || p.pushed, commits: s.commits, url: liveUrl(p, s) };
    }).filter(function(x){
      if (state.view !== "links" && state.filter !== "all" && x.p.audience !== state.filter) return false;
      if (!q) return true;
      return (x.p.name + " " + x.p.repo + " " + (x.s.desc || "") + " " + (x.url || "")).toLowerCase().indexOf(q) > -1;
    });
    list.sort(state.sort === "commits"
      ? function(a, b){ return (b.commits || 0) - (a.commits || 0) || new Date(b.pushed) - new Date(a.pushed); }
      : function(a, b){ return new Date(b.pushed) - new Date(a.pushed); });

    document.getElementById("count").textContent = list.length + " / " + window.PROJECTS.length;
    var grid = document.getElementById("grid");
    grid.className = state.view === "links" ? "links" : "grid";
    document.querySelector('[aria-label="Filter"]').style.display = state.view === "links" ? "none" : "";
    if (!list.length) { grid.innerHTML = '<p class="empty">Nothing matches.</p>'; return; }
    if (state.view === "links") {
      window.__links = list.map(function(x){ return x.p.name + ": " + (x.url || "https://github.com/" + x.p.repo); });
      grid.innerHTML = '<div class="top"><span>' + list.length + ' links</span><button class="cp" data-copy="all">Copy all</button></div>' +
        list.map(function(x, i){
          var u = x.url || "https://github.com/" + x.p.repo;
          return '<div class="lrow"><span class="n">' + esc(x.p.name) + '</span><a href="' + esc(u) + '" target="_blank" rel="noopener">' +
            esc(u.replace(/^https?:\/\//, "")) + '</a><button class="cp" data-copy="' + esc(u) + '">Copy</button></div>';
        }).join("");
      return;
    }
    grid.innerHTML = list.map(function(x, i){
      var href = x.url || "https://github.com/" + x.p.repo;
      var host = x.url ? x.url.replace(/^https?:\/\//, "").replace(/\/$/, "") : "github.com/" + x.p.repo + " · no live site";
      var og = "https://opengraph.githubassets.com/lc/" + x.p.repo;
      var img = x.url
        ? '<img loading="lazy" alt="" src="https://s0.wp.com/mshots/v1/' + encodeURIComponent(x.url) + '?w=1200&h=400" onerror="this.onerror=function(){this.remove()};this.src=\'' + og + '\'">'
        : '<img loading="lazy" alt="" src="' + og + '" onerror="this.remove()">';
      return '<a class="card" href="' + esc(href) + '" target="_blank" rel="noopener" style="--h:' + hue(x.p.repo) + '">' +
        '<div class="shot"><div class="mono">' + esc(x.p.name.slice(0, 2)) + '</div>' + img +
          '<span class="rank">#' + (i + 1) + '</span></div>' +
        '<div class="body"><div class="title"><h2>' + esc(x.p.name) + '</h2><span class="tag ' + x.p.audience + '">' + x.p.audience + '</span></div>' +
          '<div class="url">' + esc(host) + '</div>' +
          (x.s.desc ? '<div class="desc">' + esc(x.s.desc) + '</div>' : "") +
          '<div class="meta"><span><b>' + ago(x.pushed) + '</b></span><span class="dot">·</span><span><b>' + ballpark(x.commits) + '</b> commits</span></div>' +
        '</div></a>';
    }).join("");
  }

  function setStatus(t){ document.getElementById("status").textContent = t; }

  async function getJSON(url){
    var r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status);
    return r;
  }

  async function refresh(force){
    if (!force && Date.now() - stats.t < TTL) { setStatus("Stats from " + ago(new Date(stats.t).toISOString())); return; }
    setStatus("Updating from GitHub…");
    try {
      var owners = Array.from(new Set(window.PROJECTS.map(function(p){ return p.repo.split("/")[0]; })));
      for (var o of owners) {
        var r = await getJSON("https://api.github.com/users/" + o + "/repos?per_page=100&sort=pushed");
        (await r.json()).forEach(function(g){
          var cur = stats.repos[g.full_name] || {};
          cur.homepage = g.homepage || ""; cur.pages = !!g.has_pages; cur.pushed = g.pushed_at; cur.desc = g.description || "";
          stats.repos[g.full_name] = cur;
        });
      }
      render();
      var queue = window.PROJECTS.slice(), done = 0;
      async function worker(){
        while (queue.length) {
          var p = queue.shift();
          try {
            var r = await getJSON("https://api.github.com/repos/" + p.repo + "/commits?per_page=1");
            var link = r.headers.get("Link") || "", m = link.match(/[?&]page=(\d+)>;\s*rel="last"/);
            var n = m ? +m[1] : (await r.json()).length;
            (stats.repos[p.repo] = stats.repos[p.repo] || {}).commits = n;
          } catch(e) { if (e.message === "403") { queue.length = 0; throw e; } }
          done++; setStatus("Counting commits " + done + "/" + window.PROJECTS.length);
        }
      }
      await Promise.all([worker(), worker(), worker(), worker()]);
      stats.t = Date.now(); save(); render(); setStatus("Updated just now");
    } catch(e) {
      save(); render();
      setStatus(e.message === "403" ? "GitHub rate limit hit, try again in an hour" : "Offline, showing saved stats");
    }
  }

  document.getElementById("q").addEventListener("input", function(e){ state.q = e.target.value; render(); });
  document.querySelectorAll("[data-sort]").forEach(function(b){ b.addEventListener("click", function(){
    state.sort = b.dataset.sort; document.querySelectorAll("[data-sort]").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); render(); }); });
  document.querySelectorAll("[data-filter]").forEach(function(b){ b.addEventListener("click", function(){
    state.filter = b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); render(); }); });
  document.querySelectorAll("[data-view]").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.view === state.view);
    b.addEventListener("click", function(){
      state.view = b.dataset.view; try { localStorage.setItem("linkcity.view", state.view); } catch(e){}
      document.querySelectorAll("[data-view]").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); render(); }); });
  document.getElementById("grid").addEventListener("click", function(e){
    var b = e.target.closest("[data-copy]"); if (!b) return;
    var text = b.dataset.copy === "all" ? window.__links.join("\n") : b.dataset.copy;
    function done(){ var t = b.textContent; b.textContent = "Copied"; b.classList.add("ok"); setTimeout(function(){ b.textContent = t; b.classList.remove("ok"); }, 1200); }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback(){ var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
  });
  document.getElementById("refresh").addEventListener("click", function(){ refresh(true); });

  render();
  refresh(false);
})();
</script>
</body>
</html>
